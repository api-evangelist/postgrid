principles:

  - name: Visibility
    description: >-
      PostGrid provides per-piece and per-lookup cost transparency through
      published pricing pages and a dashboard. Both test and live API key
      environments are tracked separately, enabling cost attribution by
      environment. Annual savings of 10% are surfaced at plan selection.

  - name: Optimization
    description: >-
      Cost optimization strategies include: using annual billing for a 10%
      discount on address verification subscriptions; using batch verification
      endpoints to maximize throughput and reduce per-lookup cost at scale;
      selecting higher-volume subscription tiers when overage charges would
      exceed the tier upgrade cost; and negotiating enterprise custom rates
      for predictable high-volume print mail operations.
