specification: FinOps Framework
specificationVersion: '1.0'
provider: PostGrid
providerId: postgrid
created: '2026-06-12'
modified: '2026-06-12'

billingModel: hybrid
description: >-
  PostGrid uses a hybrid billing model combining per-piece usage billing (for
  the Print & Mail API) and subscription-plus-overage billing (for Address
  Verification APIs). Costs are composed of a platform/API access fee,
  per-piece production and postage fees, and per-lookup verification fees.
  Annual subscriptions provide a 10% discount. Enterprise accounts negotiate
  custom rates.

focusColumns:
  - ChargeCategory
  - ServiceName
  - ServiceSubcategory
  - ResourceType
  - UsageQuantity
  - UsageUnit
  - ListUnitPrice
  - BilledCurrency
  - BillingPeriod

