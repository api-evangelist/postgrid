  # ── Print & Mail API ──────────────────────────────────────────────────────

  - name: Print & Mail Starter
    description: >-
      Free tier for the Print & Mail API. No monthly fee. Suitable for developers
      and low-volume senders. Caps at 500 mailings per month; overages require
      contacting sales.
    type: freemium
    url: https://www.postgrid.com/pricing-print-mail/
    entries:
      - name: Monthly Mailings
        type: quota
        limit: 500
        timeFrame: month
        price: 0.00
        currency: USD
      - name: Users
        type: quota
        limit: 1
        timeFrame: month
      - name: Templates
        type: quota
        limit: 10
        timeFrame: month
      - name: Address Book Entries
        type: quota
        limit: 10000
        timeFrame: month
      - name: Black & White Letter (First Class, USA)
        type: metered
        price: 1.019
        currency: USD
        unit: per piece
      - name: Color Letter (First Class, USA)
        type: metered
        price: 1.179
        currency: USD
        unit: per piece
      - name: 4x6 Postcard (First Class, USA)
        type: metered
        price: 0.862
        currency: USD
        unit: per piece
      - name: Check
        type: metered
        price: 1.10
        currency: USD
        unit: per piece
      - name: Certified Mail
        type: metered
        price: 6.69
        currency: USD
        unit: per piece
      - name: Registered Mail
        type: metered
        price: 23.50
        currency: USD
        unit: per piece
      - name: Express Delivery
        type: metered
        price: 17.00
        currency: USD
        unit: per piece

  - name: Print & Mail Enterprise
    description: >-
      Custom enterprise tier for high-volume print & mail. Unlimited mailings,
      users, and templates. Lowest guaranteed per-piece rates. Includes dedicated
      account manager and priority support.
    type: enterprise
    url: https://www.postgrid.com/pricing-print-mail/
    entries:
      - name: Monthly Mailings
        type: boolean
        value: unlimited
      - name: Users
        type: boolean
        value: unlimited
      - name: Templates
        type: boolean
        value: unlimited
      - name: Dedicated Account Manager
        type: boolean
        value: true
      - name: Priority Support
        type: boolean
        value: true
      - name: Per-Piece Rate
        type: boolean
        value: custom-lowest-guaranteed

